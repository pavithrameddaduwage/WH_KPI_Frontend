<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Fully prevent scroll */
  }

  @media (min-width: 1024px) {
    .login-wrapper {
      align-items: center;
      justify-content: center;
      padding-top: 0;
    }
  }
</style>

<main class="h-screen">
  <div
    class="login-wrapper flex items-center justify-center h-full bg-gradient-to-t from-[rgb(8,47,73)] via-[#1e3a5f] to-[#3c6e91]"
  >
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
      
      <!-- Avatar SVG Icon -->
      <div class="flex justify-center mb-6">
        <div class="bg-[rgb(68,122,157)] p-4 rounded-full">
          <svg class="h-20 w-20 text-white" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"
            />
          </svg>
        </div>
      </div>

      <!-- Login Form -->
      <form [formGroup]="formGroup" (ngSubmit)="handleSubmit()" class="space-y-5">
        <div>
          <input
            type="text"
            placeholder="Username or Email"
            formControlName="email"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-[rgb(8,47,73)]"
          />
          <div *ngIf="formGroup.get('email')?.invalid && formGroup.get('email')?.touched" class="text-red-600 text-xs mt-1">
            Please enter your username or email.
          </div>
        </div>

        <div>
          <input
            type="password"
            placeholder="Password"
            formControlName="password"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-[rgb(8,47,73)]"
          />
          <div *ngIf="formGroup.get('password')?.invalid && formGroup.get('password')?.touched" class="text-red-600 text-xs mt-1">
            Please enter your password.
          </div>
        </div>

        <div>
          <button
            type="submit"
            [disabled]="loading"
            class="w-full py-3 bg-[rgb(8,47,73)] hover:bg-[#123b55] text-white rounded-lg text-sm font-medium transition duration-200"
          >
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>
        </div>

        <div *ngIf="errorMessage" class="text-red-600 text-center text-sm mt-3">
          {{ errorMessage }}
        </div>
      </form>

      <p class="text-center text-gray-400 text-xs mt-8">Powered by Team MIS</p>
    </div>
  </div>
</main>
