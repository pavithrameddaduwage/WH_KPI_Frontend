<div class="min-h-screen bg-gradient-to-b from-white via-sky-50 to-sky-300 flex flex-col items-center justify-start px-4 pt-8">

  <!-- Elegant Heading with Reduced Top Padding -->
  <h1 class="text-lg sm:text-xl font-light text-sky-700 mb-20">
    Select a report type to continue
  </h1>

  <!-- Navigation Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-3xl px-2">

    <!-- Daily Report -->
    <div
      class="flex items-center gap-4 bg-white border border-sky-500 rounded-xl p-6 shadow-sm hover:shadow-md hover:border-sky-300 transition-all cursor-pointer"
      (click)="navigateTo('/daily')"
    >
      <div class="bg-sky-100 text-sky-700 w-12 h-12 flex items-center justify-center rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 17v-6h6v6m2 4H7a2 2 0 01-2-2V5a2 2 0 012-2h5l2 2h5a2 2 0 012 2v12a2 2 0 01-2 2z" />
        </svg>
      </div>
      <span class="text-base text-gray-700 group-hover:text-sky-700">Daily Reports</span>
    </div>

    <!-- Weekly Report -->
    <div
      class="flex items-center gap-4 bg-white border border-cyan-500 rounded-xl p-6 shadow-sm hover:shadow-md hover:border-cyan-300 transition-all cursor-pointer"
      (click)="navigateTo('/weekly')"
    >
      <div class="bg-cyan-100 text-cyan-700 w-12 h-12 flex items-center justify-center rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18M3 17h18" />
        </svg>
      </div>
      <span class="text-base text-gray-700 group-hover:text-cyan-700">Weekly Reports</span>
    </div>

  </div>
</div>
