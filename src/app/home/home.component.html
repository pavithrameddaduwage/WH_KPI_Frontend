<main class="pt-16 ">

<div class="min-h-screen bg-gradient-to-b from-white via-sky-50 to-sky-300 flex flex-col items-center justify-start px-4 pt-16">

  <!-- Elegant Heading -->
  <h1 class="text-2xl sm:text-3xl font-semibold text-sky-800 mb-16 text-center">
    Select a Report Type to Continue
  </h1>

  <!-- Navigation Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 w-full max-w-4xl px-2">

    <!-- Daily Report -->
    <div
      class="group flex items-center gap-6 bg-white border border-sky-500 rounded-2xl p-8 shadow-md hover:shadow-xl hover:border-sky-400 transition-all duration-300 cursor-pointer"
      (click)="navigateTo('/daily')"
    >
      <div class="bg-sky-100 text-sky-700 w-16 h-16 flex items-center justify-center rounded-xl">
        <!-- Calendar Check Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 2a1 1 0 011 1v1h10V3a1 1 0 112 0v1h1a1 1 0 011 1v4H3V5a1 1 0 011-1h1V3a1 1 0 112 0v1zm-3 8h18v9a2 2 0 01-2 2H5a2 2 0 01-2-2v-9zm12.707 3.293a1 1 0 00-1.414-1.414L11 15.172l-1.293-1.293a1 1 0 10-1.414 1.414L11 18l4.707-4.707z" />
        </svg>
      </div>
      <span class="text-xl text-gray-800 font-medium group-hover:text-sky-700">
        Daily Reports
      </span>
    </div>

    <!-- Weekly Report -->
    <div
      class="group flex items-center gap-6 bg-white border border-cyan-500 rounded-2xl p-8 shadow-md hover:shadow-xl hover:border-cyan-400 transition-all duration-300 cursor-pointer"
      (click)="navigateTo('/weekly')"
    >
      <div class="bg-cyan-100 text-cyan-700 w-16 h-16 flex items-center justify-center rounded-xl">
        <!-- Bar Chart Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 3v18h18M9 17V9m4 8v-5m4 5v-9" />
        </svg>
      </div>
      <span class="text-xl text-gray-800 font-medium group-hover:text-cyan-700">
        Weekly Reports
      </span>
    </div>

  </div>
</div>
</main>
