<div class="min-h-screen bg-[#082f49] flex items-start justify-center py-10 px-4">
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-md w-full">

    <!-- Daily Reports Card -->
    <div
      class="bg-white rounded-xl shadow-md border border-gray-200 px-5 pb-5 pt-6 flex flex-col items-center text-center hover:shadow-lg hover:scale-[1.02] transition-all duration-300 cursor-pointer"
      (click)="navigateTo('daily')"
    >
      <div class="bg-blue-100 text-blue-700 p-2 rounded-full mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-6h6v6m2 4H7a2 2 0 01-2-2V5a2 2 0 012-2h5l2 2h5a2 2 0 012 2v12a2 2 0 01-2 2z" />
        </svg>
      </div>
      <h2 class="text-lg font-semibold text-gray-800 mb-1">Daily Reports</h2>
      <p class="text-sm text-gray-600">Upload your daily report files easily.</p>
    </div>

    <!-- Weekly Reports Card -->
    <div
      class="bg-white rounded-xl shadow-md border border-gray-200 px-5 pb-5 pt-6 flex flex-col items-center text-center hover:shadow-lg hover:scale-[1.02] transition-all duration-300 cursor-pointer"
      (click)="navigateTo('weekly')"
    >
      <div class="bg-blue-100 text-blue-700 p-2 rounded-full mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18M3 17h18" />
        </svg>
      </div>
      <h2 class="text-lg font-semibold text-gray-800 mb-1">Weekly Reports</h2>
      <p class="text-sm text-gray-600">Submit and track your weekly reports.</p>
    </div>

  </div>
</div>
