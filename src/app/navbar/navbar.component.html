<!-- Fixed Top Navigation Bar -->
<nav class="bg-sky-950 fixed top-0 left-0 right-0 z-50">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
        <!-- Logo -->
        <a href="/home">
          <img src="assets/logo.png" class="h-8" alt="Company Logo" />
        </a>
        <div class="hidden sm:ml-6 sm:flex sm:items-center sm:space-x-6">
          <h1 class="text-horizon-blue text-lg font-semibold">WH-Report Upload</h1>
        </div>
        <div *ngIf="isLoggedIn" class="hidden sm:ml-6 sm:flex sm:items-center sm:space-x-6">
          <a href="/daily" class="text-gray-300 hover:text-white text-sm font-medium">Daily Reports</a>
          <a href="/weekly" class="text-gray-300 hover:text-white text-sm font-medium">Weekly Reports</a>
        </div>
      </div>
      <div *ngIf="isLoggedIn" class="flex items-center space-x-3 text-white">
        <div class="h-8 w-8 rounded-full bg-sky-700 flex items-center justify-center font-bold uppercase">
          {{ userInitial }}
        </div>
        <button (click)="logout()" title="Logout"
                class="flex items-center px-3 py-1 rounded-md bg-sky-700 hover:bg-horizon-blue-700 text-white text-sm font-medium transition">
          Logout
        </button>
      </div>

 
      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <button type="button"
                class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
                aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          <svg class="hidden h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

 
  <div class="sm:hidden" id="mobile-menu">
    <div class="space-y-1 px-2 pb-3 pt-2">
      <h1 class="text-horizon-blue text-lg font-semibold">WH-Report Upload</h1>
      <ng-container *ngIf="isLoggedIn">
        <a href="/daily" class="block text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-base font-medium">Daily</a>
        <a href="/weekly" class="block text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-base font-medium">Weekly</a>
      </ng-container>
    </div>
  </div>
</nav>
